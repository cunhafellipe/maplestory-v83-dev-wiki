site_name: MapleStory v83 二次開發 WIKI
site_description: GMS v83 客戶端逆向、協議與二次開發知識庫 — 所有技術主張皆有自動驗證支撐
site_author: Generated
site_url: https://e78-png.github.io/maplestory-v83-dev-wiki/
repo_url: https://github.com/e78-png/maplestory-v83-dev-wiki
repo_name: e78-png/maplestory-v83-dev-wiki
docs_dir: docs

extra_css:
  - assets/stylesheets/extra.css

extra:
  fonts:
    - text: Inter
      url: https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2
    - text: Inter
      url: https://fonts.gstatic.com/s/inter/v13/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2
    - text: JetBrains Mono
      url: https://fonts.gstatic.com/s/jetbrainsmono/v23/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxTOlOV.woff2
    - text: JetBrains Mono
      url: https://fonts.gstatic.com/s/jetbrainsmono/v23/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxjPVmUsa.woff2

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  # Dark is the intended experience, so it is listed first and therefore
  # becomes the default; the system preference still picks between them.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切換至亮色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切換至深色
  icon:
    repo: fontawesome/brands/github
    logo: material/leaf-maple

plugins:
  # Default config. Note: a `separator` option was tried to split camelCase
  # repo names (MapleBench -> Maple Bench) and had no effect — Material's
  # indexer does not support it. Partial names and author handles do work.
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

